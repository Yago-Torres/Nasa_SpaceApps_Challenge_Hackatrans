name: "Roadmap feature"
description: "Define an executable, testable product task"
title: "[FEATURE] "
labels: ["roadmap"]
body:
  - type: markdown
    attributes:
      value: "A sufficiently specified roadmap Issue can be implemented directly. Coordinate shared contracts and record verified results."
  - type: textarea
    id: problem
    attributes:
      label: User problem and expected impact
      description: What farmer/reviewer need does this solve, and which of the four awards does it support?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and UI/API boundaries
      description: Exact inputs, outputs, states and interactions; link specs or ADR as needed
    validations:
      required: true
  - type: textarea
    id: science
    attributes:
      label: Scientific evidence, privacy and external API implications
      description: Sources, uncertainty, fake-data risks, permissions and security
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Testable acceptance criteria
      description: Include functional, negative/failure and integration checks
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and affected components
      description: Contracts, migrations, technical dependencies and affected consumers
    validations:
      required: true
  - type: dropdown
    id: coordination
    attributes:
      label: Which additional review is required before integration?
      options: ["Architecture or shared contract", "Science or data quality", "Privacy or security", "Standard domain review"]
    validations:
      required: true
