name: product-checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Resolve, sync and verify backend
        working-directory: backend
        run: |
          # When backend/uv.lock has been committed, enforce its consistency.
          if test -f uv.lock; then
            uv sync --locked --extra dev
          else
            uv sync --extra dev
          fi
          uv run --extra dev pytest -q
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  context-policy:
    name: context-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --no-project python scripts/check_context.py
