name: product-checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agro
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: agroblackbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agro -d agroblackbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agro:ci_only@localhost:5432/agroblackbox_test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Resolve, sync and verify backend
        working-directory: backend
        run: |
          uv lock --check
          uv sync --locked --extra dev
          uv run --locked --extra dev pytest -q
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Unit and component tests (Vitest)
        run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  context-policy:
    name: context-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --no-project python scripts/check_context.py
