name: product-checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agro
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: agroblackbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agro -d agroblackbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agro:ci_only@localhost:5432/agroblackbox_test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Resolve, sync and verify backend
        working-directory: backend
        run: |
          uv lock --check
          uv sync --locked --extra dev
          uv run --locked --extra dev pytest -q
      - name: Main journey E2E with SYNTHETIC fixtures (ABB-29, must run, not skip)
        working-directory: backend
        run: |
          uv run --locked --extra dev pytest -q -m e2e -rs | tee e2e.log
          if grep -qi "skipped" e2e.log; then echo "E2E tests were skipped: TEST_DATABASE_URL missing?"; exit 1; fi
          grep -Eq "[0-9]+ passed" e2e.log
      - name: Export the OpenAPI contract
        working-directory: backend
        run: uv run --locked python ../scripts/export_openapi.py ../openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: openapi.json
          if-no-files-found: error
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install uv (to export the backend OpenAPI contract)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Export the backend OpenAPI contract (ABB-29)
        run: |
          uv python install 3.12
          cd backend && uv sync --locked && uv run --locked python ../scripts/export_openapi.py ../frontend/.openapi.json
      - name: Unit, component and OpenAPI contract tests (Vitest)
        run: npm test
        working-directory: frontend
        env:
          OPENAPI_JSON: .openapi.json
      - run: npm run build
        working-directory: frontend
  context-policy:
    name: context-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --no-project python scripts/check_context.py
  deploy-smoke:
    # ABB-30: build both images, deploy them with the real scripts from a throwaway local tag, check
    # readiness, take a backup and run the restore drill. Nothing is pushed or published.
    name: deploy-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Deploy, back up and restore-check with deploy/bin
        run: |
          git config user.email ci@example.invalid && git config user.name ci
          git tag v0.0.0-ci
          {
            echo "CROPSTORY_VERSION=v0.0.0-ci"
            echo "CROPSTORY_IMAGE_PREFIX=local/cropstory"
            echo "APP_ENV=ci"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "WEB_PORT=18080"
            echo "METRICS_TOKEN=$(openssl rand -hex 24)"
            echo "BACKUP_DIR=$RUNNER_TEMP/backups"
          } > deploy/.env
          chmod 600 deploy/.env
          deploy/bin/deploy.sh v0.0.0-ci --build
          deploy/bin/status.sh
          dump="$(deploy/bin/backup.sh ci | tail -1)"
          deploy/bin/restore.sh "$dump" --check
          curl -fsS -o /dev/null -w 'index %{http_code}\n' http://127.0.0.1:18080/
          curl -fsSI http://127.0.0.1:18080/ | grep -i '^content-security-policy'
      - name: Container logs
        if: always()
        run: docker compose -p cropstory logs --no-color --tail 200 || true
