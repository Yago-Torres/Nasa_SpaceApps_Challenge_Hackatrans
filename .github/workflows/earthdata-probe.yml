name: earthdata-probe (temporary)
on:
  push:
    branches: [feat/09-gpm-imerg]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: dump HLS COG headers
        run: |
          B=https://data.lpdaac.earthdatacloud.nasa.gov/lp-prod-protected/HLSL30.020/HLS.L30.T30TVK.2023154T105502.v2.0/HLS.L30.T30TVK.2023154T105502.v2.0
          for band in B04 Fmask; do
            echo "##### $band"
            curl -s -L -D h.txt -o $band.bin -r 0-65535 -H "Authorization: Bearer $TOKEN" "$B.$band.tif"
            grep -i '^HTTP\|content-range\|content-length' h.txt
            python3 .github/probe/tiffdump.py $band.bin
          done
          echo "##### public stac"
          curl -s -L -w '\nstatus=%{http_code}\n' "https://data.lpdaac.earthdatacloud.nasa.gov/lp-prod-public/HLSL30.020/HLS.L30.T30TVK.2023154T105502.v2.0/HLS.L30.T30TVK.2023154T105502.v2.0_stac.json" | head -c 2500
