name: earthdata-probe (temporary)
on:
  push:
    branches: [feat/09-gpm-imerg]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - name: diagnose the Earthdata token (never prints it)
        run: |
          set -u
          python3 - <<'PY'
          import base64, json, os, time
          t = os.environ['TOKEN'].strip()
          parts = t.split('.')
          print('jwt parts:', len(parts), '| has whitespace:', t != os.environ['TOKEN'])
          if len(parts) == 3:
              p = json.loads(base64.urlsafe_b64decode(parts[1] + '=' * (-len(parts[1]) % 4)))
              print('claims keys:', sorted(p))
              print('type:', p.get('type'), '| iss:', p.get('iss'))
              for k in ('iat', 'exp'):
                  if k in p: print(k, time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime(p[k])))
              print('expired:', p.get('exp', 0) < time.time())
          PY
          echo "=== GES DISC direct data (Range 0-99)"
          curl -s -L -o out.bin -w 'status=%{http_code} final=%{url_effective}\n' -r 0-99 -H "Authorization: Bearer $TOKEN" \
            "https://data.gesdisc.earthdata.nasa.gov/data/GPM_L3/GPM_3IMERGM.07/2023/3B-MO.MS.MRG.3IMERG.20230601-S000000-E235959.06.V07B.HDF5" | sed 's/[?].*//'
          head -c 300 out.bin | strings | head -5; echo
          echo "=== LP DAAC HLS COG (Range 0-99)"
          curl -s -L -o out.bin -w 'status=%{http_code} final=%{url_effective}\n' -r 0-99 -H "Authorization: Bearer $TOKEN" \
            "https://data.lpdaac.earthdatacloud.nasa.gov/lp-prod-protected/HLSL30.020/HLS.L30.T30TVK.2023154T105502.v2.0/HLS.L30.T30TVK.2023154T105502.v2.0.B04.tif" | sed 's/[?].*//'
          head -c 300 out.bin | strings | head -5; echo
