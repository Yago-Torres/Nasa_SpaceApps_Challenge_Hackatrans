name: earthdata-smoke
# Manual real-source smoke test for the NASA Earthdata sources (ABB-12 HLS). Needs the EARTHDATA_TOKEN
# repository secret; reads public NASA data for a public, region-level coordinate (no farm, no user data).
on:
  workflow_dispatch:
  push:
    branches: [feat/09-gpm-imerg]   # TEMPORARY while ABB-12 is verified; removed before merge
permissions: {contents: read}
jobs:
  hls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Real HLS smoke through /api/vegetation/hls
        working-directory: backend
        env:
          RUN_REAL_SOURCES: "1"
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          test -n "$EARTHDATA_TOKEN" || { echo "EARTHDATA_TOKEN secret is not set"; exit 1; }
          uv sync --locked --extra dev
          uv run --locked --extra dev pytest -q -m real_network -s -rs -k hls tests/test_real_sources_smoke.py
      - name: TEMPORARY cross-check against rasterio/GDAL
        working-directory: backend
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: uv run --locked --with rasterio --with numpy python ../.github/probe/crosscheck.py
